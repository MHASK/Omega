name: Check Omega
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Editor/package-lock.json
      - run: npm ci --prefix Relay
      - run: npm test --prefix Relay
      - run: npm ci --prefix Editor
      - run: npm test --prefix Editor
      - run: npm run build --prefix Editor
      - run: ./build.sh "$RUNNER_TEMP/Omega.app"
      - run: '"$RUNNER_TEMP/Omega.app/Contents/MacOS/Folio" --self-test'
      - run: '"$RUNNER_TEMP/Omega.app/Contents/MacOS/Folio" --mcp-test'
      - run: '"$RUNNER_TEMP/Omega.app/Contents/MacOS/Folio" --undo-test'
      - run: xcrun swiftc GitSync.swift LiveCheckpointStore.swift Tests/GitSyncCheck.swift -o "$RUNNER_TEMP/GitSyncCheck"
      - run: '"$RUNNER_TEMP/GitSyncCheck"'
      - run: xcrun swiftc -parse-as-library Tests/WebLiveCheck.swift -o "$RUNNER_TEMP/WebLiveCheck" -framework AppKit -framework WebKit
      - run: '"$RUNNER_TEMP/WebLiveCheck" "$PWD/Resources"'
      - run: xcrun swiftc -parse-as-library Tests/WebPresenceCheck.swift -o "$RUNNER_TEMP/WebPresenceCheck" -framework AppKit -framework WebKit
      - run: OMEGA_NODE="$(command -v node)" "$RUNNER_TEMP/WebPresenceCheck" "$PWD/Resources"
