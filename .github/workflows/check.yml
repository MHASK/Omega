name: Check Omega
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Editor/package-lock.json
      - run: npm ci --prefix Relay
      - run: npm test --prefix Relay
      - run: npm ci --prefix Editor
      - run: npm test --prefix Editor
      - run: node Tests/task-import-contract.mjs
      - run: npm run build --prefix Editor
      - run: ./build.sh "$RUNNER_TEMP/Omega.app"
      - run: '"$RUNNER_TEMP/Omega.app/Contents/MacOS/Folio" --self-test'
      - run: '"$RUNNER_TEMP/Omega.app/Contents/MacOS/Folio" --mcp-test'
      - run: '"$RUNNER_TEMP/Omega.app/Contents/MacOS/Folio" --undo-test'
      - run: zsh Tests/check-notebook-migration.sh
      - run: zsh Tests/check-external-edits.sh
      - run: zsh Tests/check-checklists.sh
      - run: zsh Tests/check-folder-tasks.sh
      - run: zsh Tests/check-navigation-linked.sh
      - run: zsh Tests/check-formulas.sh
      - run: xcrun swiftc -parse-as-library Core.swift Coordination.swift Recovery.swift UndoHistory.swift Tests/WebDiagramCheck.swift -o "$RUNNER_TEMP/WebDiagramCheck" -framework AppKit -framework WebKit -lsqlite3
      - run: '"$RUNNER_TEMP/WebDiagramCheck" "$PWD/Resources" "$RUNNER_TEMP/diagrams.png"'
      - run: xcrun swiftc -D FOLDER_TASK_CHECK Core.swift Coordination.swift Checklist.swift FolderTasks.swift Tests/FolderTasksCheck.swift -o "$RUNNER_TEMP/FolderTasksCheck"
      - run: '"$RUNNER_TEMP/FolderTasksCheck"'
      - run: xcrun swiftc -parse-as-library Core.swift Coordination.swift Recovery.swift UndoHistory.swift Tests/WebTaskCheck.swift -o "$RUNNER_TEMP/WebTaskCheck" -framework AppKit -framework WebKit -lsqlite3
      - run: '"$RUNNER_TEMP/WebTaskCheck" "$PWD/Resources" "$RUNNER_TEMP/tasks.png"'
      - run: xcrun swiftc GitSync.swift LiveCheckpointStore.swift Tests/GitSyncCheck.swift -o "$RUNNER_TEMP/GitSyncCheck"
      - run: '"$RUNNER_TEMP/GitSyncCheck"'
      - run: ./Tests/check-git-app.sh
      - run: xcrun swiftc GitSync.swift GitMerge.swift LiveCheckpointStore.swift Tests/GitMergeCheck.swift -o "$RUNNER_TEMP/GitMergeCheck"
      - run: '"$RUNNER_TEMP/GitMergeCheck" "$RUNNER_TEMP/merge-fixture.json"'
      - run: xcrun swiftc -parse-as-library Tests/WebMergeCheck.swift -o "$RUNNER_TEMP/WebMergeCheck" -framework AppKit -framework WebKit
      - run: '"$RUNNER_TEMP/WebMergeCheck" "$PWD/Resources" "$RUNNER_TEMP/merge-fixture.json" "$RUNNER_TEMP"'
      - run: xcrun swiftc GitSync.swift LiveCheckpointStore.swift Tests/GitAutoSyncCheck.swift -o "$RUNNER_TEMP/GitAutoSyncCheck"
      - run: '"$RUNNER_TEMP/GitAutoSyncCheck"'
      - run: xcrun swiftc -parse-as-library Tests/WebLiveCheck.swift -o "$RUNNER_TEMP/WebLiveCheck" -framework AppKit -framework WebKit
      - run: '"$RUNNER_TEMP/WebLiveCheck" "$PWD/Resources"'
      - run: xcrun swiftc -parse-as-library Tests/WebPresenceCheck.swift -o "$RUNNER_TEMP/WebPresenceCheck" -framework AppKit -framework WebKit
      - run: OMEGA_NODE="$(command -v node)" "$RUNNER_TEMP/WebPresenceCheck" "$PWD/Resources"
      - run: xcrun swiftc -parse-as-library Tests/WebWritingCheck.swift -o "$RUNNER_TEMP/WebWritingCheck" -framework AppKit -framework WebKit
      - run: '"$RUNNER_TEMP/WebWritingCheck" "$PWD/Resources" "$RUNNER_TEMP"'
