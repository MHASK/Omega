<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<style>
:root{color-scheme:light;--paper:#faf9f6;--panel:#f4f3f0;--ink:#292a29;--muted:#787a78;--line:#e2e1dd;--accent:#79678d;--soft:#ece7f1;--minus:#9a5559;--minus-bg:#ba62620d;--plus:#497960;--plus-bg:#669b7812;--focus:#aa86be20}
:root.dark{color-scheme:dark;--paper:#1e1e1e;--panel:#1a1a1a;--ink:#dedfdd;--muted:#858984;--line:#303230;--accent:#c5b4d8;--soft:#c5b4d818;--minus:#d19d9e;--minus-bg:#cd858513;--plus:#a2c1b1;--plus-bg:#84b09c15;--focus:#b9a6ce20}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:12px -apple-system,BlinkMacSystemFont,sans-serif}button,select,input,textarea{font:inherit;color:inherit}button,select{border:1px solid transparent;background:transparent;border-radius:5px;padding:6px 9px;cursor:pointer;white-space:nowrap}button:hover,select:hover{background:var(--soft)}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}button.primary{background:var(--soft);color:var(--accent);font-weight:600;border-color:color-mix(in srgb,var(--accent) 18%,transparent)}.muted{color:var(--muted)}.spacer{flex:1}.row{display:flex;align-items:center;gap:10px}.small{font-size:11px}#app{height:100%;display:flex;flex-direction:column}header{padding:16px 22px 13px;flex-shrink:0;gap:12px}#filename{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#path{margin-top:5px;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#stats{font:11px ui-monospace,SFMono-Regular,monospace;white-space:nowrap}.plus{color:var(--plus)}.minus{color:var(--minus)}.segmented{display:flex;border:1px solid var(--line);padding:2px;border-radius:6px;gap:1px}.segmented button{font-size:11px;padding:4px 9px}.segmented button.active{background:var(--soft);color:var(--ink)}.tools{padding:7px 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:42px;flex-shrink:0}.divider{width:1px;height:16px;background:var(--line)}#conflictLabel{font-weight:500;min-width:87px}.nav{padding:3px 7px;color:var(--muted);font-size:16px}#diffArea{flex:1;min-height:90px;overflow:auto;overscroll-behavior:contain}#diff{min-width:460px}.diffhead{display:grid;grid-template-columns:1fr 1fr;position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line)}.diffhead>div{padding:10px 18px;font-size:11px;display:flex;gap:8px;align-items:center}.diffhead>div+div{border-left:1px solid var(--line)}.badge{width:6px;height:6px;border-radius:50%;background:currentColor}.diffrow{display:grid;grid-template-columns:1fr 1fr;min-height:23px}.cell{display:flex;min-width:0;align-items:stretch;font:12px/23px ui-monospace,SFMono-Regular,Menlo,monospace}.cell+.cell{border-left:1px solid var(--line)}.num{width:43px;flex-shrink:0;text-align:right;padding-right:12px;color:var(--muted);user-select:none;font-size:10px}.sign{width:17px;flex-shrink:0;text-align:center;user-select:none;opacity:.7}.code{white-space:pre-wrap;overflow-wrap:anywhere;padding-right:18px;min-width:0;tab-size:4}.removed{background:var(--minus-bg)}.added{background:var(--plus-bg)}.removed .sign{color:var(--minus)}.added .sign{color:var(--plus)}.absent{background:var(--panel)}.hunk{font:10px/29px ui-monospace,SFMono-Regular,monospace;padding-left:18px;color:var(--muted);background:var(--panel);border-block:1px solid var(--line)}.unified .diffrow{display:block}.unified .cell{border:0}.unified .num{width:38px}.empty{padding:32px;text-align:center;color:var(--muted);line-height:1.7}.active-conflict{box-shadow:inset 2px 0 var(--accent)}.change-word{background:var(--focus);border-radius:2px}.removed .change-word{background:#ce81812c}.added .change-word{background:#83af9830}.original{border-bottom:1px solid var(--line);padding:12px 20px;color:var(--muted);font:11px/1.7 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;max-height:160px;overflow:auto}.original b{font:10px -apple-system;display:block;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}#resultPanel{height:42%;min-height:170px;display:flex;flex-direction:column;border-top:1px solid var(--line)}#splitter{height:5px;flex-shrink:0;cursor:row-resize;background:var(--panel);border-block:1px solid var(--line)}#splitter:hover{background:var(--soft)}.resulttools{padding:9px 22px;flex-shrink:0;border-bottom:1px solid var(--line);font-size:11px}#resultStatus{color:var(--muted)}#editor{display:flex;flex:1;min-height:0;overflow:hidden}#gutter{width:52px;flex-shrink:0;text-align:right;padding:14px 12px 24px 0;white-space:pre;overflow:hidden;color:var(--muted);font:10px/23px ui-monospace,SFMono-Regular,monospace;user-select:none;background:var(--panel)}textarea{border:0;resize:none;margin:0;background:var(--paper);outline:none!important;line-height:23px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;padding:14px 22px 24px 12px;flex:1;min-width:0;tab-size:4;white-space:pre;overflow:auto}#actions{border-top:1px solid var(--line);padding:12px 22px;min-height:53px;flex-shrink:0}#hint{color:var(--muted);font-size:11px;max-width:440px;line-height:1.5}#fileMenu{max-width:146px;font-size:11px;color:var(--muted);border-color:var(--line)}#manualConfirm{display:none;align-items:center;gap:6px;color:var(--muted);font-size:11px}input[type=checkbox]{accent-color:var(--accent)}#loading{padding:40px;color:var(--muted)}#binary{display:none;flex:1}.binarycopies{display:flex;gap:16px;padding:24px}.binarycopy{flex:1;border:1px solid var(--line);padding:30px 18px;border-radius:8px;line-height:1.8;text-align:center}.fileIcon{font-size:28px;color:var(--muted);margin-bottom:12px}body.busy button,body.busy select,body.busy textarea{pointer-events:none;opacity:.5}button.selected{background:var(--soft);color:var(--accent)}[hidden]{display:none!important}@media(max-width:670px){header,.tools,.resulttools,#actions{padding-left:14px;padding-right:14px}.tools{gap:4px;flex-wrap:wrap}#hint{max-width:210px}#allChanges{font-size:10px}#fileMenu{max-width:110px}.resulttools{gap:6px;flex-wrap:wrap}.cell{font-size:11px}.num{width:30px;padding-right:6px}.code{padding-right:8px}}
</style></head><body><div id="app">
<header class="row"><div style="min-width:0;flex:1"><div id="filename">Review changes</div><div id="path"></div></div><div id="stats"></div><div class="segmented" id="layout"><button data-mode="split" class="active" aria-label="Side by side diff">Split</button><button data-mode="unified" aria-label="Unified diff">Unified</button></div></header>
<div id="loading">Preparing the Git comparison…</div>
<div id="toolbar" class="tools row" hidden><button id="previous" class="nav" aria-label="Previous conflict">‹</button><span id="conflictLabel"></span><button id="next" class="nav" aria-label="Next conflict">›</button><div class="divider"></div><button id="useCurrent">Use current</button><button id="useIncoming">Use incoming</button><button id="useBoth">Use both</button><span class="spacer"></span><button id="showBase" class="muted small">Original</button><button id="allChanges" class="muted small">All changes</button></div>
<div id="base" class="original" hidden></div>
<div id="diffArea" hidden><div id="diff"></div></div>
<div id="binary"></div>
<div id="splitter" role="separator" aria-label="Resize result editor" tabindex="0" hidden></div>
<div id="resultPanel" hidden><div class="resulttools row"><strong>Result</strong><span id="resultStatus"></span><span class="spacer"></span><label id="manualConfirm"><input id="acknowledge" type="checkbox">I’ve resolved the remaining conflicts</label><button id="undo" class="muted small" aria-label="Undo merge choice">Undo</button></div><div id="editor"><div id="gutter" aria-hidden="true"></div><textarea id="result" spellcheck="false" aria-label="Merged result"></textarea></div></div>
<footer id="actions" class="row" hidden><span id="hint"></span><span class="spacer"></span><select id="fileMenu" aria-label="Whole file actions"><option value="">File actions…</option value="mine">Keep current file</option><option value="incoming">Use incoming file</option><option value="both">Keep two files</option></select><button id="save" class="primary">Mark resolved</button></footer>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);let config,parts,choices=[],active=0,manual=false,ack=false,all=false,mode='split',history=[],busy=false;const conflicts=()=>parts?.filter(p=>p.common==null)||[];
function post(kind,extra={}){window.webkit?.messageHandlers.review.postMessage({kind,path:config.path,...extra})}
function state(){return {text:$('result').value,choices:[...choices],manual,ack,active}}
function remember(){history.push(state());if(history.length>100)history.shift()}
function persist(){post('draft',{draft:JSON.stringify(state())})}
function lines(text){if(!text)return [];let value=text.split('\n');if(value.at(-1)==='')value.pop();return value}
function joinBoth(a,b){return a+(a&&!a.endsWith('\n')&&b?'\n':'')+b}
function assembled(){let i=0;return parts.map(p=>{if(p.common!=null)return p.common;let choice=choices[i++];return choice==='incoming'?p.incoming:choice==='both'?joinBoth(p.current,p.incoming):p.current}).join('')}
function rangeFor(index){let i=0,start=0;for(const p of parts){let value;if(p.common!=null)value=p.common;else{let c=choices[i];value=c==='incoming'?p.incoming:c==='both'?joinBoth(p.current,p.incoming):p.current;if(i===index)return [start,start+value.length];i++}start+=value.length}return [0,0]}
function focusResult(){if(manual)return;let [start,end]=rangeFor(active),result=$('result');result.setSelectionRange(start,end);result.scrollTop=Math.max(0,(result.value.slice(0,start).split('\n').length-3)*23);$('gutter').scrollTop=result.scrollTop}
function update(){if(!config.editable)return;const n=conflicts().length,remaining=choices.filter(x=>!x).length;$('conflictLabel').textContent=n?`Conflict ${active+1} of ${n}`:'No text conflicts';$('previous').disabled=active===0;$('next').disabled=active>=n-1;for(const [id,value]of [['useCurrent','current'],['useIncoming','incoming'],['useBoth','both']]){$(id).disabled=!n||manual||config.currentDeleted||config.incomingDeleted;$(id).classList.toggle('selected',choices[active]===value)}$('allChanges').textContent=all?'Conflicts only':'All changes';$('allChanges').hidden=!n;$('showBase').disabled=!n;$('resultStatus').textContent=manual?'Edited by you':remaining?`${remaining} unresolved`:'Ready to save';$('manualConfirm').style.display=manual&&remaining?'flex':'none';$('acknowledge').checked=ack;$('save').disabled=busy||!config.editable||(remaining>0&&!(manual&&ack));$('save').textContent=busy?'Saving…':'Mark resolved';$('undo').disabled=!history.length;const lineCount=$('result').value.split('\n').length;$('gutter').textContent=Array.from({length:lineCount},(_,i)=>i+1).join('\n');$('hint').textContent=config.currentDeleted||config.incomingDeleted?'One copy was deleted. Choose a file action to keep or delete it.':remaining?'Choose each change above, or edit the result below.':'Review the result, then mark this file resolved.';if(config.currentDeleted||config.incomingDeleted)$('save').disabled=true}
function cell(text,number,kind='',otherNumber){const el=document.createElement('div');el.className='cell '+kind;const num=document.createElement('span');num.className='num';num.textContent=number??'';el.append(num);if(otherNumber!==undefined){const other=num.cloneNode();other.textContent=otherNumber??'';el.append(other)}const sign=document.createElement('span');sign.className='sign';sign.textContent=kind==='removed'?'−':kind==='added'?'+':'';const code=document.createElement('span');code.className='code';code.textContent=text??'';el.append(sign,code);return el}
function emphasize(a,b){if(!a?.classList.contains('removed')||!b?.classList.contains('added'))return;const ac=a.querySelector('.code'),bc=b.querySelector('.code'),x=ac.textContent,y=bc.textContent;let start=0,end=0;while(start<Math.min(x.length,y.length)&&x[start]===y[start])start++;while(end<Math.min(x.length,y.length)-start&&x[x.length-1-end]===y[y.length-1-end])end++;if(!start&&!end)return;for(const [node,text]of [[ac,x],[bc,y]]){const mark=document.createElement('span');mark.className='change-word';mark.textContent=text.slice(start,text.length-end);node.replaceChildren(document.createTextNode(text.slice(0,start)),mark,document.createTextNode(text.slice(text.length-end)))}}
function row(a,b){emphasize(a,b);const part=conflicts()[active];if(all&&part){for(const [c,key]of [[a,'current'],[b,'incoming']]){if(!c)continue;const first=numberFor(part,key),n=Number(c.querySelector('.num')?.textContent);if(n>=first&&n<first+lines(part[key]).length)c.classList.add('active-conflict')}}const el=document.createElement('div');el.className='diffrow';if(a)el.append(a);if(b)el.append(b);$('diff').append(el)}
function heading(){let h=document.createElement('div');h.className='diffhead';if(mode==='split'){for(const [label,detail,tone]of [['Current','This Mac','minus'],['Incoming',config.branch?'origin/'+config.branch:'Repository','plus']]){const div=document.createElement('div'),dot=document.createElement('span');dot.className='badge '+tone;const title=document.createElement('strong');title.textContent=label;const sub=document.createElement('span');sub.textContent=detail;sub.className='muted';div.append(dot,title,sub);h.append(div)}}else{h.style.gridTemplateColumns='1fr';let div=document.createElement('div');div.textContent='Current → Incoming';h.append(div)}$('diff').append(h)}
function numberFor(part,key){let at=0;for(const p of conflicts()){const chunk=p[key];let found=config[key].indexOf(chunk,at);if(found<0)found=at;if(p===part)return config[key].slice(0,found).split('\n').length;at=found+chunk.length}return 1}
function render(){if(!config?.editable)return;$('diff').replaceChildren();$('diff').className=mode;heading();const part=conflicts()[active];if(!all&&part){const a=lines(part.current),b=lines(part.incoming),an=numberFor(part,'current'),bn=numberFor(part,'incoming');const h=document.createElement('div');h.className='hunk';h.textContent=`Conflicting lines · −${an},${a.length} +${bn},${b.length}`;$('diff').append(h);if(mode==='split'){for(let i=0;i<Math.max(a.length,b.length,1);i++)row(cell(a[i],a[i]!=null?an+i:null,a[i]!=null?'removed':'absent'),cell(b[i],b[i]!=null?bn+i:null,b[i]!=null?'added':'absent'))}else{a.forEach((s,i)=>row(cell(s,an+i,'removed',null)));b.forEach((s,i)=>row(cell(s,null,'added',bn+i)))}if(!a.length||!b.length){const e=document.createElement('div');e.className='empty';e.textContent=!a.length?'Current side removes these lines.':'Incoming side removes these lines.';$('diff').append(e)}$('base').replaceChildren();const title=document.createElement('b');title.textContent='Original · before either edit';$('base').append(title,document.createTextNode(part.base||'Empty in the original'))}else renderPatch(config.patch);$('diffArea').scrollTop=0;if(all){const focus=$('diff').querySelector('.active-conflict');if(focus)$('diffArea').scrollTop=Math.max(0,focus.offsetTop-$('diff').offsetTop-80)}}
function renderPatch(patch){let old=0,neo=0,started=false,pending=[];const flush=()=>{if(!pending.length)return;if(mode==='split'){let a=pending.filter(l=>l[0]==='-'),b=pending.filter(l=>l[0]==='+');for(let i=0;i<Math.max(a.length,b.length);i++)row(cell(a[i]?.[1],a[i]?.[2],a[i]?'removed':'absent'),cell(b[i]?.[1],b[i]?.[2],b[i]?'added':'absent'))}else for(const [type,text,n]of pending)row(type==='-'?cell(text,n,'removed',null):cell(text,null,'added',n));pending=[]};for(const line of patch.split('\n')){const match=/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);if(match){flush();old=+match[1];neo=+match[2];started=true;let h=document.createElement('div');h.className='hunk';h.textContent=line;$('diff').append(h);continue}if(!started)continue;if(line[0]==='-'){pending.push(['-',line.slice(1),old++]);continue}if(line[0]==='+'){pending.push(['+',line.slice(1),neo++]);continue}flush();if(line[0]===' '){mode==='split'?row(cell(line.slice(1),old++),cell(line.slice(1),neo++)):row(cell(line.slice(1),old++,'',neo++))}else if(line.startsWith('\\ ')){let h=document.createElement('div');h.className='hunk';h.textContent=line.slice(2);$('diff').append(h)}}flush();if(!started){let e=document.createElement('div');e.className='empty';e.textContent='The text is identical. Review the shared document history, then mark this file resolved.';$('diff').append(e)}}
function choose(choice){if(manual||busy)return;remember();choices[active]=choice;$('result').value=assembled();persist();update();focusResult()}
function resolve(choice){if(busy)return;post('resolve',{choice,text:$('result').value})}
$('useCurrent').onclick=()=>choose('current');$('useIncoming').onclick=()=>choose('incoming');$('useBoth').onclick=()=>choose('both');$('save').onclick=()=>{if(!$('save').disabled)resolve('edited')};$('fileMenu').onchange=e=>{if(e.target.value)resolve(e.target.value);e.target.value=''};
$('previous').onclick=()=>{active=Math.max(0,active-1);render();update();focusResult()};$('next').onclick=()=>{active=Math.min(conflicts().length-1,active+1);render();update();focusResult()};$('allChanges').onclick=()=>{all=!all;if(all)$('base').hidden=true;render();update()};$('showBase').onclick=()=>{$('base').hidden=!$('base').hidden;render()};
for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===button));render()};
$('result').addEventListener('beforeinput',remember);$('result').oninput=()=>{manual=true;ack=false;persist();update()};$('result').onscroll=()=>{$('gutter').scrollTop=$('result').scrollTop};$('acknowledge').onchange=e=>{ack=e.target.checked;persist();update()};
function undo(){const previous=history.pop();if(!previous||busy)return;$('result').value=previous.text;choices=previous.choices;manual=previous.manual;ack=previous.ack;active=previous.active;persist();update();render()}
$('undo').onclick=undo;document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();undo()}if(e.altKey&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();$(e.key==='ArrowDown'?'next':'previous').click()}});
$('splitter').onpointerdown=e=>{e.preventDefault();const start=e.clientY,initial=$('resultPanel').getBoundingClientRect().height;const move=ev=>{$('resultPanel').style.height=Math.max(150,Math.min(innerHeight-250,initial+start-ev.clientY))+'px'};const end=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',end)};addEventListener('pointermove',move);addEventListener('pointerup',end)};
$('splitter').onkeydown=e=>{if(['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();$('resultPanel').style.height=Math.max(150,Math.min(innerHeight-250,$('resultPanel').offsetHeight+(e.key==='ArrowUp'?30:-30)))+'px'}};
window.omegaReview={configure(dark,isBusy){document.documentElement.classList.toggle('dark',dark);busy=isBusy;document.body.classList.toggle('busy',busy);$('app').inert=busy;$('result').readOnly=busy;if(config)update()},open(value){history=[];active=0;manual=false;ack=false;config=value;parts=value.parts||[];choices=conflicts().map(()=>null);$('filename').textContent=value.path.split('/').pop();$('path').textContent=value.path.includes('/')?value.path:'Git merge review';$('loading').hidden=true;$('actions').hidden=false;$('layout').hidden=!value.editable;if(!value.editable){$('binary').style.display='block';const shell=document.createElement('div');shell.className='binarycopies';for(const [title,deleted,size]of [['Current',value.currentDeleted,value.currentSize],['Incoming',value.incomingDeleted,value.incomingSize]]){let item=document.createElement('div');item.className='binarycopy';let icon=document.createElement('div');icon.className='fileIcon';icon.textContent=deleted?'−':'◇';let name=document.createElement('strong');name.textContent=title;let detail=document.createElement('div');detail.className='muted';detail.textContent=deleted?'Deleted on this side':`${size.toLocaleString()} bytes · attachment`;item.append(icon,name,detail);shell.append(item)}$('binary').append(shell);$('save').hidden=true;$('hint').textContent='Attachments are kept intact. Choose one version, or keep two separate files.';return}for(const id of ['toolbar','diffArea','resultPanel','splitter'])$(id).hidden=false;$('result').value=assembled();try{const saved=JSON.parse(value.draft);if(typeof saved.text==='string'&&saved.choices.length===choices.length){choices=saved.choices;manual=saved.manual===true;ack=saved.ack===true;active=Math.max(0,Math.min(conflicts().length-1,saved.active||0));$('result').value=saved.text}}catch{}let plus=0,minus=0;for(const l of value.patch.split('\n')){if(l[0]==='+'&&!l.startsWith('+++'))plus++;if(l[0]==='-'&&!l.startsWith('---'))minus++}$('stats').replaceChildren();for(const [n,cls,s]of [[plus,'plus','+'],[minus,'minus','−']]){const span=document.createElement('span');span.className=cls;span.textContent=`${s}${n} `;$('stats').append(span)}all=true;render();update()},error(message){$('loading').hidden=false;$('loading').textContent=message}};
</script></body></html>
