<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src folio:; style-src folio: 'unsafe-inline'; img-src folio: https: http:; font-src folio:; connect-src 'none';"><title>Omega editor</title><link rel="stylesheet" href="folio://app/editor.css"></head><body>
<div id="task-page" aria-label="Task page" hidden></div>
<div id="scroller"><main id="editor"></main></div><textarea id="source" aria-label="Markdown source" spellcheck="false" hidden></textarea><button id="mode" hidden>Markdown</button>
<div id="bubble" class="popover bubble" role="toolbar" aria-label="Text formatting" hidden>
<select id="block-type" aria-label="Turn into"><option value="0">Text</option><option value="1">Heading 1</option><option value="2">Heading 2</option><option value="3">Heading 3</option><option value="4">Heading 4</option><option value="5">Heading 5</option><option value="6">Heading 6</option></select><span class="separator"></span>
<button data-command="bold" data-mark="bold" title="Bold · ⌘B" aria-label="Bold"><span class="text-icon">B</span></button><button data-command="italic" data-mark="italic" title="Italic · ⌘I" aria-label="Italic"><span class="text-icon italic">I</span></button><button data-command="underline" data-mark="underline" title="Underline · ⌘U" aria-label="Underline"><span class="text-icon" style="text-decoration:underline">U</span></button><button data-command="strike" data-mark="strike" title="Strikethrough" aria-label="Strikethrough"><span class="text-icon strike">S</span></button><button data-command="code" data-mark="code" title="Inline code" aria-label="Inline code"><span class="mono">&lt;/&gt;</span></button><span class="separator"></span><button data-command="color" title="Text color & highlight" aria-label="Text color and highlight"><span class="color-icon">A</span></button><button data-command="comment" title="Comment · ⌥⌘M" aria-label="Comment"><span class="icon">&#xf075;</span></button><span class="separator"></span><button data-command="page" title="Link to a page" aria-label="Link to a page"><span class="icon">&#xf15b;</span></button><button data-command="link" data-mark="link" title="Link" aria-label="Link"><span class="icon">&#xf0c1;</span></button></div>
<div id="slash" class="popover" role="listbox" aria-label="Insert block" hidden></div>
<div id="table-tools" class="popover" role="toolbar" aria-label="Table actions" hidden>
<select id="table-rows" aria-label="Row actions" title="Insert or remove the current row"><option value="">Rows</option><option value="addRowBefore">Insert row above</option><option value="addRowAfter">Insert row below</option><option value="deleteRow">Remove current row</option></select>
<select id="table-columns" aria-label="Column actions" title="Insert or remove the current column"><option value="">Columns</option><option value="addColumnBefore">Insert column left</option><option value="addColumnAfter">Insert column right</option><option value="deleteColumn">Remove current column</option></select>
<button id="table-formula" title="Calculate this cell · supports references across pages" aria-label="Edit cell formula">ƒx</button><span class="separator"></span><select id="table-more" aria-label="More table actions"><option value="">•••</option><option value="align-left">Align left</option><option value="align-center">Align center</option><option value="align-right">Align right</option><option value="deleteTable">Remove table</option></select></div>
<button id="table-add-row" class="table-edge" title="Add a row at the bottom" aria-label="Add a row at the bottom" hidden>+</button>
<button id="table-add-column" class="table-edge" title="Add a column on the right" aria-label="Add a column on the right" hidden>+</button>
<form id="entry" class="popover" hidden><label id="entry-label" for="entry-input">Link</label><input id="entry-input" autocomplete="off" spellcheck="false"><div class="actions"><button type="button" id="entry-cancel">Cancel</button><button type="submit">Done</button></div></form>
<div id="page-picker" class="popover" role="dialog" aria-label="Link to a page" hidden><div class="page-picker-input"><span class="icon" aria-hidden="true">&#xf0c1;</span><input id="page-input" role="combobox" aria-label="Find a note to link" aria-controls="page-results" aria-expanded="true" aria-autocomplete="list" placeholder="Link to a page…" autocomplete="off"><button data-close title="Cancel" aria-label="Cancel page link">×</button></div><div id="page-results" role="listbox" aria-label="Notes"></div></div>
<div id="find" class="popover" hidden><input id="find-input" aria-label="Find in note" placeholder="Find in note…"><button id="find-next" title="Next match">↵</button><button id="find-close" title="Close find">×</button></div><div id="toast" hidden></div><script src="folio://app/editor.js"></script></body></html>
